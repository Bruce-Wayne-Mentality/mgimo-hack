name: Tests

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dekanat
          POSTGRES_PASSWORD: dekanat
          POSTGRES_DB: dekanat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dekanat" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Tests on SQLite
        run: python -m unittest discover -s tests -v
      - name: Auth and DB tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://dekanat:dekanat@127.0.0.1:5432/dekanat_test
        run: python -m unittest tests.test_auth tests.test_db -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
