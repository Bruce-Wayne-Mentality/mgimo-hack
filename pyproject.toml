[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgimo-hack-schedule"
version = "0.1.0"
description = "Personal student schedules backed by HSE timetable data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.30,<1",
    "pywebpush>=2.0,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "argon2-cffi>=23.1,<26",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
hse-schedule = "hse_schedule.cli:main"

[tool.setuptools.packages.find]
include = ["hse_schedule*"]

[tool.setuptools.package-data]
hse_schedule = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
